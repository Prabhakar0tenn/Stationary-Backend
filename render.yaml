# render.yaml — Infrastructure as Code for Render
# Place this file at the project ROOT (same level as pom.xml)
# Render reads this on every deploy to configure the service.

services:
  - type: web
    name: stationary-backend
    runtime: java
    plan: free          # free tier — sleeps after 15 min inactivity
    region: singapore   # closest to India on free tier
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/stationary-backend-0.0.1-SNAPSHOT.jar"

    # Health check — Render pings this to know the service is ready
    healthCheckPath: /api/v1/actuator/health

    # Environment variables — values set in Render dashboard (NOT here)
    # List them here so Render knows to expect them.
    envVars:
      - key: MONGODB_URI
        sync: false       # "sync: false" = set manually in dashboard
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms200m"   # tune memory for free tier (512MB limit)
